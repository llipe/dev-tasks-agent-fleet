name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = local/dev + Docker base; 3.14 = AgentCore production runtime.
        # Running both closes the runtime-parity gap recorded in TESTING.md.
        python-version: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: agents/dependency-update/app/dependencyUpdate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agents/dependency-update/app/dependencyUpdate/pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy .

      - name: Test with coverage (pytest)
        run: pytest --cov --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        run: pip-audit . --strict

  panel-quality:
    name: Panel quality gate (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter panel run lint

      - name: Format check (prettier)
        run: pnpm --filter panel run format:check

      - name: Typecheck (tsc)
        run: pnpm --filter panel run typecheck

      - name: Test with coverage (vitest)
        run: pnpm --filter panel run test:coverage

      - name: Dependency audit (pnpm audit)
        run: pnpm --filter panel run audit
