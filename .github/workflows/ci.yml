name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = local/dev + Docker base; 3.14 = AgentCore production runtime.
        # Running both closes the runtime-parity gap recorded in TESTING.md.
        python-version: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: agents/dependency-update/app/dependencyUpdate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agents/dependency-update/app/dependencyUpdate/pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy .

      - name: Test with coverage (pytest)
        run: pytest --cov --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        run: pip-audit . --strict

  panel-quality:
    name: Panel quality gate (JS/TS)
    runs-on: ubuntu-latest
    # The panel job now runs the Layer 2.5 integration suites and the S-114 E2E
    # suite against a REAL local Supabase stack (#134). REQUIRE_LOCAL_DB=1 makes
    # a Docker-gated skip of any Layer 2.5 suite a hard FAILURE here — a green CI
    # must mean the DB-boundary assertions actually ran, never that they were
    # skipped vacuously.
    env:
      REQUIRE_LOCAL_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # --- Local Supabase stack (Layer 2.5 + E2E) -----------------------------
      # Start the CLI stack and apply supabase/migrations/ + supabase/seed.sql
      # (via `supabase db reset`) BEFORE the test branch, so the integration
      # suites and the E2E run have a real, seeded database. The GitHub Ubuntu
      # runner ships Docker; the `supabase` CLI is provided by the setup action.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations + seed (db reset)
        run: supabase db reset --local

      - name: Export local Supabase env
        # `supabase status -o env` prints API_URL / ANON_KEY / SERVICE_ROLE_KEY /
        # DB_URL for the running stack. Map them to the names the panel + tests
        # read (SD2 server-only names — never NEXT_PUBLIC_*).
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/sb.env
          # shellcheck disable=SC1090
          source /tmp/sb.env
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_HOST=127.0.0.1"
            echo "SUPABASE_DB_PORT=54322"
          } >> "$GITHUB_ENV"

      - name: Lint (eslint)
        run: pnpm --filter panel run lint

      - name: Format check (prettier)
        run: pnpm --filter panel run format:check

      - name: Typecheck (tsc)
        run: pnpm --filter panel run typecheck

      # Warm up Supabase Realtime before the Layer 2.5 + E2E branch: right after
      # `db reset` a cold Realtime can flake the first subscription (stream-e2e,
      # live-tail) under retries:0. Explicit readiness wait, not a sleep.
      - name: Warm up Supabase Realtime
        run: pnpm --filter panel exec node scripts/warm-realtime.mjs

      # `test:coverage` runs the unit + component + integration projects. With
      # REQUIRE_LOCAL_DB=1 and the stack up, the Layer 2.5 suites run for real;
      # a probe failure or Docker-gated skip fails the job (#134).
      - name: Test with coverage (vitest — incl. gated Layer 2.5)
        run: pnpm --filter panel run test:coverage

      # E2E: install the browser (+ OS deps) and run the seven scenarios against
      # the started stack. The stack is already reset+seeded above, so E2E skips
      # its own reset (E2E_DB_RESET unset → verify-and-assert-catalog only).
      - name: Install Playwright browser (chromium)
        run: pnpm --filter panel exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm --filter panel run test:e2e

      - name: Dependency audit (pnpm audit)
        # Runs a resilient wrapper (panel/scripts/audit.mjs): a real high/
        # critical advisory fails the gate, a clean/moderate-only audit passes,
        # and an unreachable npm advisory registry (ERR_SOCKET_TIMEOUT etc.) is
        # retried then soft-passed with a loud warning rather than reddening CI
        # on a third-party network blip.
        timeout-minutes: 5
        run: pnpm --filter panel run audit
