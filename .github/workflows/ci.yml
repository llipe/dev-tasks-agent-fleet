name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality gate (${{ matrix.agent }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = local/dev + Docker base; 3.14 = AgentCore production runtime.
        # Running both closes the runtime-parity gap recorded in TESTING.md.
        python-version: ["3.13", "3.14"]
        # One gate per Python agent. security-analyst was added at its PRD
        # close (S-141): its 700+ tests were previously unreachable from CI.
        agent: [dependency-update, security-analyst]
        include:
          - agent: dependency-update
            package-dir: agents/dependency-update/app/dependencyUpdate
          - agent: security-analyst
            package-dir: agents/security-analyst/app/securityAnalyst
    defaults:
      run:
        working-directory: ${{ matrix.package-dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.package-dir }}/pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy .

      - name: Test with coverage (pytest)
        run: pytest --cov --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        run: pip-audit . --strict

  panel-quality:
    name: Panel quality gate (JS/TS)
    runs-on: ubuntu-latest
    # The panel job now runs the Layer 2.5 integration suites and the S-114 E2E
    # suite against a REAL local Supabase stack (#134). REQUIRE_LOCAL_DB=1 makes
    # a Docker-gated skip of any Layer 2.5 suite a hard FAILURE here — a green CI
    # must mean the DB-boundary assertions actually ran, never that they were
    # skipped vacuously.
    env:
      REQUIRE_LOCAL_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Assert the job actually runs on Node 26 (not just that the pin file was
      # edited): a stale toolchain cache or an un-bumped matrix would otherwise
      # pass vacuously (#217 verifier F-02, AC1/AC5).
      - name: Assert Node 26 (verifier F-02)
        run: |
          set -euo pipefail
          node -v
          node -v | grep -qE '^v26\.' || { echo "FAIL: expected Node v26.x, got $(node -v)" >&2; exit 1; }

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # --- Local Supabase stack (Layer 2.5 + E2E) -----------------------------
      # Start the CLI stack and apply supabase/migrations/ + supabase/seed.sql
      # (via `supabase db reset`) BEFORE the test branch, so the integration
      # suites and the E2E run have a real, seeded database. The GitHub Ubuntu
      # runner ships Docker; the `supabase` CLI is provided by the setup action.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations + seed (db reset)
        run: supabase db reset --local

      - name: Export local Supabase env
        # `supabase status -o env` prints API_URL / ANON_KEY / SERVICE_ROLE_KEY /
        # DB_URL for the running stack. Map them to the names the panel + tests
        # read. SD2: only the anon URL + anon key get a NEXT_PUBLIC_ twin — the
        # SERVICE_ROLE_KEY is exported ONLY under its server-only name.
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/sb.env
          # shellcheck disable=SC1090
          source /tmp/sb.env
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_HOST=127.0.0.1"
            echo "SUPABASE_DB_PORT=54322"
            # Publishable anon pair the auth clients (S-116) need at the CI job
            # level so the spawned E2E `next dev` webServer has them (#170). This
            # does NOT weaken SD2 — the service-role key is never given a
            # NEXT_PUBLIC_ twin; only the anon URL + anon key are public.
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"

      - name: Lint (eslint)
        run: pnpm --filter panel run lint

      - name: Format check (prettier)
        run: pnpm --filter panel run format:check

      - name: Typecheck (tsc)
        run: pnpm --filter panel run typecheck

      # Auth release-gate parser (S-122, SR2 inversion / PRD AC17). This
      # REPLACES the S-115 privacy-gate steps: auth reverses "privacy is the
      # only boundary" (D16), so the mechanical check is replaced, not removed.
      # `fly deploy` is NOT run in CI, but the gate's decision logic
      # (panel/scripts/panel-auth-check.mjs) is pure and unit-tested — run it by
      # name here so a regression in the gate parser reddens CI independently of
      # the broader suite. A protected-path-200 / SSE-200 / successful-signup /
      # missing-env fixture must make the parser report a failing verdict.
      - name: Auth-gate parser test (S-122)
        run: pnpm --filter panel exec vitest run --project unit panel-auth-check

      # Static-check the release-gate shell script itself (shellcheck ships on
      # the GitHub Ubuntu runner). The parser is unit-tested above; this catches
      # shell-level regressions in the wrapper that invokes it.
      - name: Shellcheck the auth-gate script (S-122)
        run: shellcheck scripts/verify-panel-auth.sh

      # Static-check the release deploy script (deploy-panel.yml calls it).
      # `fly deploy` itself is NOT run in CI here — only the shell is linted.
      - name: Shellcheck the deploy script
        run: shellcheck scripts/deploy-panel.sh

      # Static-check the release-numbering script. It never runs unattended
      # in CI (human-only guard inside the script itself) — this only lints it.
      - name: Shellcheck the release script
        run: shellcheck scripts/release-panel.sh

      # Static-check the panel runtime entrypoint (Issue #280). It starts the
      # container as root, group-grants the Fly OIDC socket, then drops to uid
      # 1001 via setpriv. POSIX sh, `set -eu` — shellcheck guards it like the
      # other release-path scripts.
      - name: Shellcheck the panel entrypoint (#280)
        run: shellcheck panel/scripts/docker-entrypoint.sh

      # Warm up Supabase Realtime before the Layer 2.5 + E2E branch: right after
      # `db reset` a cold Realtime can flake the first subscription (stream-e2e,
      # live-tail) under retries:0. Explicit readiness wait, not a sleep.
      - name: Warm up Supabase Realtime
        run: pnpm --filter panel exec node scripts/warm-realtime.mjs

      # `test:coverage` runs the unit + component + integration projects. With
      # REQUIRE_LOCAL_DB=1 and the stack up, the Layer 2.5 suites run for real;
      # a probe failure or Docker-gated skip fails the job (#134).
      - name: Test with coverage (vitest — incl. gated Layer 2.5)
        run: pnpm --filter panel run test:coverage

      # E2E: install the browser (+ OS deps) and run the seven scenarios against
      # the started stack. The stack is already reset+seeded above, so E2E skips
      # its own reset (E2E_DB_RESET unset → verify-and-assert-catalog only).
      - name: Install Playwright browser (chromium)
        run: pnpm --filter panel exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm --filter panel run test:e2e

      - name: Dependency audit (pnpm audit)
        # Runs a resilient wrapper (panel/scripts/audit.mjs): a real high/
        # critical advisory fails the gate, a clean/moderate-only audit passes,
        # and an unreachable npm advisory registry (ERR_SOCKET_TIMEOUT etc.) is
        # retried then soft-passed with a loud warning rather than reddening CI
        # on a third-party network blip.
        timeout-minutes: 5
        run: pnpm --filter panel run audit

      # --- Image smoke test (Issue #280, D-06) --------------------------------
      # Build Dockerfile.panel and prove the runtime user invariant holds OFF
      # Fly: with NO /.fly/api socket, the container must (a) start normally and
      # answer on :8080, and (b) run its server process (PID 1) as uid 1001 —
      # never root. Today's image already passes; this step exists to GUARD the
      # switch to start-as-root + `setpriv` (Dockerfile.panel / docker-entrypoint
      # .sh), which would silently leave the server running as root if the
      # privilege drop ever broke. The GitHub Ubuntu runner ships Docker.
      - name: Build panel image (smoke test)
        run: docker build -f Dockerfile.panel -t dt-panel:ci .

      - name: Smoke test — server on :8080, routes gate, PID 1 is uid 1001 (#280, #217 D-16)
        run: |
          set -euo pipefail
          # No /.fly/api is mounted — exercises the socket-absent path (AC3).
          # The fake env is enough for the proxy gate + /login to render; the
          # invalid Supabase URL only matters for data reads, not the gate.
          CID=$(docker run -d -p 8080:8080 \
            -e SUPABASE_URL=http://example.invalid \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-smoke \
            -e NEXT_PUBLIC_SUPABASE_URL=http://example.invalid \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-smoke \
            dt-panel:ci)
          cleanup() { docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Wait for the server to bind and answer on :8080. Any HTTP response
          # proves the server started and is serving; a never-answering port
          # means it did not start (AC3).
          ready=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "server answered on :8080 with HTTP $code"
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "FAIL: server never answered on :8080" >&2
            docker logs "$CID" >&2 || true
            exit 1
          fi

          # Route-level gate assertions (#217 D-16): the proxy must gate
          # identically on the Node runtime. Any other code fails the job.
          assert_code() {
            method="$1"; path="$2"; want="$3"
            got=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "http://localhost:8080${path}")
            echo "${method} ${path} -> ${got} (want ${want})"
            [ "$got" = "$want" ] || { echo "FAIL: ${method} ${path} expected ${want}, got ${got}" >&2; docker logs "$CID" >&2 || true; exit 1; }
          }
          # Unauth UI root → 302 /login; /login itself renders 200 (no network);
          # unauth SSE → 401; unauth internal POST → 401 (secret-gated handler).
          assert_code GET "/" 302
          assert_code GET "/login" 200
          assert_code GET "/api/runs/00000000-0000-0000-0000-000000000000/events/stream" 401
          assert_code POST "/api/internal/schedules/00000000-0000-0000-0000-000000000000/fire" 401

          # PID 1 must be uid 1001 / gid 1001 — the entrypoint dropped privileges
          # via setpriv and node is PID 1 (AC2). A root PID 1 fails the gate.
          uid_line=$(docker exec "$CID" grep '^Uid:' /proc/1/status)
          gid_line=$(docker exec "$CID" grep '^Gid:' /proc/1/status)
          echo "PID 1 $uid_line"
          echo "PID 1 $gid_line"
          echo "$uid_line" | grep -qE '^Uid:[[:space:]]+1001[[:space:]]+1001' \
            || { echo "FAIL: PID 1 is not uid 1001 (server running as root?)" >&2; exit 1; }
          echo "$gid_line" | grep -qE '^Gid:[[:space:]]+1001[[:space:]]+1001' \
            || { echo "FAIL: PID 1 is not gid 1001" >&2; exit 1; }
          echo "OK: server on :8080, routes gate correctly, PID 1 is uid/gid 1001"
