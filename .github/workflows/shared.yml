name: CI — Shared

on:
  push:
    branches: [main, "integration/**"]
    paths:
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/shared.yml"
  pull_request:
    branches: [main, "integration/**"]
    paths:
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/shared.yml"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # "Validate all consumers" below runs `pnpm -r run typecheck`, which
      # includes agents/dep-updater — a real consumer of packages/shared via
      # generated/shared_contract.py. Its scripts shell into `uv`, so the
      # Python toolchain has to be present. Keep identical to agent.yml.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          # agents/dep-updater/pyproject.toml requires >=3.13; provision it
          # explicitly instead of relying on uv's implicit download.
          python-version: "3.13"
          working-directory: agents/dep-updater
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: pnpm install --frozen-lockfile

      # `python-version` above only sets UV_PYTHON; install the interpreter
      # explicitly so provisioning is a visible, cacheable step rather than an
      # implicit download inside the first `uv run`.
      - name: Install Python
        run: uv python install 3.13
        working-directory: agents/dep-updater

      # Materialise the environment from uv.lock so the consumer typecheck runs
      # against locked versions and fails loudly if the lockfile is stale.
      - name: Sync Python environment
        run: uv sync --locked --all-groups
        working-directory: agents/dep-updater

      - name: Lint
        run: pnpm --filter @fleet/shared run lint

      - name: Format check
        run: pnpm --filter @fleet/shared run format:check

      - name: Type check
        run: pnpm --filter @fleet/shared run typecheck

      - name: Test
        run: pnpm --filter @fleet/shared run test

      - name: Codegen drift check
        run: |
          pnpm --filter @fleet/shared run codegen
          git diff --exit-code packages/shared/generated/ || (echo "ERROR: Generated files are out of date! Run 'pnpm --filter shared run codegen' and commit the result." && exit 1)

      - name: Import boundary check
        run: pnpm run check-boundaries

      - name: Validate all consumers
        run: pnpm -r run typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
        if: vars.AWS_CI_ROLE_ARN != ''
