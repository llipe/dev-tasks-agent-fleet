name: CI — Control Plane

on:
  push:
    branches: [main, "integration/**"]
    paths:
      - "apps/control-plane/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/control-plane.yml"
  pull_request:
    branches: [main, "integration/**"]
    paths:
      - "apps/control-plane/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/control-plane.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @fleet/control-plane run lint

      - name: Format check
        run: pnpm --filter @fleet/control-plane run format:check

      - name: Type check
        run: pnpm --filter @fleet/control-plane run typecheck

      - name: Test
        run: pnpm --filter @fleet/control-plane run test

      - name: Import boundary check
        run: pnpm run check-boundaries

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
        if: vars.AWS_CI_ROLE_ARN != ''

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-control-plane
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --config infra/control-plane.fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
