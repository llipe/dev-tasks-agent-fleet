app = "agent-fleet-control-plane"
primary_region = "iad"

[build]
dockerfile = "apps/control-plane/Dockerfile"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
path = "/healthz"
interval = "30s"
timeout = "5s"
grace_period = "10s"

[env]
NODE_ENV = "production"
PORT = "3000"
