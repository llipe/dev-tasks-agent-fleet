[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dependency-update"
version = "0.1.0"
description = "Dependency update agent for AgentCore — audits, classifies, fixes, and opens PRs"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore==1.22.0",
    "strands-agents==1.53.0",
    "boto3==1.43.81",
    "requests==2.34.2",
    "PyJWT==2.13.0",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests (no I/O, no network)",
    "component: component tests (mocked external services)",
]

# ---------------------------------------------------------------------------
# Quality toolchain
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
# Exclude vendored / generated / non-source paths from lint + format.
extend-exclude = [
    ".venv",
    "tests/fixtures",
    "agent_reporter.py",  # vendored SDK — copied byte-identical from docs/reference/
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy patterns and long lines in fixtures/mocks.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
# Vendored SDK is not type-checked (copied verbatim from docs/reference/).
exclude = ["agent_reporter\\.py", "tests/fixtures/", "\\.venv/"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "agent_reporter.py",
    ".venv/*",
    "main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# No hard threshold enforced yet — coverage is measured and reported, but the
# baseline is still being established across the pipeline modules (#72-#77).
# Raise `fail_under` once the deterministic pipeline modules are implemented.
