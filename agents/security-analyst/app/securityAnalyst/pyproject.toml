[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-analyst"
version = "0.1.0"
description = "Security analyst agent for AgentCore — five-tool scanner, dedupe, classify, fix, PR"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore==1.22.0",
    "strands-agents==1.53.0",
    "boto3==1.43.81",
    "requests==2.34.2",
    "PyJWT==2.13.0",
    "cryptography==50.0.1",
    # Scanner toolchains: semgrep and checkov ship as pip packages with a
    # bundled scan binary; gitleaks and trivy are separate Go binaries
    # installed in the Dockerfile (no PyPI package). Real-repo verification
    # (S-141) found these four were never added to the image -- only CodeQL's
    # toolchain (a two-part CLI + query-pack install) landed in S-132.
    "semgrep==1.177.0",
    # checkov pinned to 3.2.0, not latest (3.3.17): starting at checkov
    # 3.2.15 (confirmed via PyPI metadata; 3.2.10 is still loose), checkov
    # pins boto3 to an exact old version (e.g. ==1.34.25 at 3.2.15, ==1.35.49
    # by 3.3.17), which conflicts with this project's own boto3==1.43.81 pin
    # (needed by bedrock-agentcore/strands-agents). 3.2.0 is the newest
    # checkov release with a loose boto3 range (>=1.28.0,<2.0.0) that
    # resolves cleanly against both. Also requires rustc/cargo in the
    # Dockerfile (see that file) since checkov's rustworkx dependency has
    # no Python 3.13 wheel and must build from source.
    "checkov==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests (no I/O, no network)",
    "component: component tests (mocked external services)",
]

# ---------------------------------------------------------------------------
# Quality toolchain
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
# Exclude vendored / generated / non-source paths from lint + format.
extend-exclude = [
    ".venv",
    "tests/fixtures",
    "agent_reporter.py",  # vendored SDK — copied byte-identical from docs/reference/
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy patterns and long lines in fixtures/mocks.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
# Vendored SDK is not type-checked (copied verbatim from docs/reference/).
exclude = ["agent_reporter\\.py", "tests/fixtures/", "\\.venv/"]

# The `exclude` regex above only filters paths during directory recursion; on
# mypy 2.3.1 the vendored SDK is still discovered by the `mypy .` scan and its
# `__exit__` methods (declared `-> bool`, always returning False) trip the
# `exit-return` check. The file MUST stay byte-identical to
# docs/reference/agent_reporter.py (D13/D24, sibling namespace), so we suppress
# that one error code for this module only — the real source modules keep full
# strictness.
[[tool.mypy.overrides]]
module = "agent_reporter"
disable_error_code = ["exit-return"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "agent_reporter.py",
    ".venv/*",
    "main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Floor set at PRD close (S-141 / Phase 5 QA rollup): measured 95% after
# porting the sibling agent's credentials/signal_backstop/scrubber tests.
# `main.py` and `agent_reporter.py` are omitted above (exercised by the
# component pipeline tests and real invocations, not unit-covered).
fail_under = 90
